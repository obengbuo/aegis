[project]
name = "aegis"
version = "0.1.0"
description = "Runtime security and governance for the Model Context Protocol"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[mcp]>=0.0.20",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: real network/model calls — excluded from fast unit-test runs",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
