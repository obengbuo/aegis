[project]
name = "aegis"
version = "0.1.0"
description = "Runtime governance layer for AI agents. Deterministic capability enforcement, no LLM in the enforcement path, forensic audit trail"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Stone / Obeng Buo" },
]
keywords = [
    "mcp",
    "ai-security",
    "agent-governance",
    "prompt-injection",
    "pydantic-ai",
]
dependencies = [
    "pydantic-ai-slim[mcp]>=0.0.20",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]

[project.urls]
Repository = "https://github.com/obengbuo/aegis"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-rerunfailures>=14.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: real network/model calls — excluded from fast unit-test runs",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
